<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Period Tracker & Ovulation Calculator - WOmenCare</title>
  <meta name="description" content="Interactive menstrual cycle tracker, ovulation prediction calculator, symptom diary, and personalized wellness suggestions.">

  <!-- Favicon & Brand Icons -->
  <link rel="icon" type="image/png" href="assets/images/Firefly.png">
  <link rel="apple-touch-icon" href="assets/images/Firefly.png">
  <meta property="og:title" content="Period Tracker & Ovulation Calculator - WOmenCare">
  <meta property="og:description" content="Interactive menstrual cycle tracker, ovulation prediction calculator, and personalized wellness.">
  <meta property="og:image" content="assets/images/Firefly.png">
  <meta property="og:type" content="website">

  <!-- Preconnect Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FFF6F8',
              100: '#FCE4EB',
              200: '#F5DCE4',
              300: '#F393AF',
              400: '#EB7A9A',
              500: '#DD5C82',
              600: '#C1436A',
              900: '#3B2531',
            }
          }
        }
      }
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-[#FFF6F8] text-[#3B2531] min-h-screen flex flex-col justify-between">

  <!-- Site Header (Managed by nav-footer.js) -->
  <header id="site-header"></header>

  <!-- Main Content Container for Seamless Page Switching -->
  <div id="app-content-container" class="w-full flex-grow flex flex-col justify-between">
    <!-- Main Tracker Container -->
    <main class="flex-grow pt-4 sm:pt-6 pb-20 sm:pb-12">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <!-- Interactive Mount Point -->
        <div id="tracker-root" class="w-full">
          <!-- Rendered by tracker-ui.js -->
          <div class="max-w-md mx-auto py-16 text-center text-pink-600 font-bold flex items-center justify-center gap-3">
            <span class="animate-spin" data-icon="refresh" data-size="24"></span>
            <span>Loading your cycle insights...</span>
          </div>
        </div>

      </div>
    </main>

    <!-- Sticky Bottom Navigation for Mobile / Tablet App View -->
    <div class="sm:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-[#F5DCE4] z-40 px-4 py-2 flex justify-around items-center max-w-md mx-auto shadow-lg">
      <button onclick="navigateTo('dashboard')" class="flex flex-col items-center justify-center py-1 px-3 text-[11px] font-bold text-pink-700 hover:text-pink-800">
        <span data-icon="home" data-size="18"></span>
        <span class="mt-0.5">Home</span>
      </button>
      <button onclick="navigateTo('record')" class="flex flex-col items-center justify-center py-1 px-3 text-[11px] font-semibold text-[#8A6575] hover:text-pink-600">
        <span data-icon="droplet" data-size="18"></span>
        <span class="mt-0.5">Log</span>
      </button>
      <button onclick="navigateTo('symptoms')" class="flex flex-col items-center justify-center py-1 px-3 text-[11px] font-semibold text-[#8A6575] hover:text-pink-600">
        <span data-icon="activity" data-size="18"></span>
        <span class="mt-0.5">Symptoms</span>
      </button>
      <button onclick="navigateTo('history')" class="flex flex-col items-center justify-center py-1 px-3 text-[11px] font-semibold text-[#8A6575] hover:text-pink-600">
        <span data-icon="barChart" data-size="18"></span>
        <span class="mt-0.5">History</span>
      </button>
    </div>
  </div>

  <!-- Site-Wide Comprehensive Footer (Managed by nav-footer.js) -->
  <footer id="site-footer"></footer>

  <!-- Scripts -->
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/tracker-engine.js" defer></script>
  <script src="assets/js/tracker-ui.js" defer></script>
  <script src="assets/js/nav-footer.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
